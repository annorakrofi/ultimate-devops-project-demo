# CI for Product Catalog Service

name: product-catalog-ci


on: 
    pull_request: #This is our build trigger so we can show the ares are working. To see iff they are working fine or not.
        branches:
        - main

jobs:   #This is  the first job. 
    build:
        runs-on: ubuntu-latest #Ubuntu runner. 

        steps: 
        - name: checkout code 
          uses: actions/checkout@v4

        - name: Setup Go 1.22 #setting up go. 
          uses: actions/setup-go@v2
          with:
            go-version: 1.22
        
        - name: Build  #building the project. 
          run: |
            cd src/product-catalog   
            go mod download
            go build -o product-catalog-service main.go

        - name: unit tests  #Running unit test 
          run: |
            cd src/product-catalog
            go test ./...
    
    code-quality: #This is also another job. 
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@v4
        
        - name: Setup Go 1.22
          uses: actions/setup-go@v2
          with:
           go-version: 1.22
        
        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@v6
          with:
            version: v1.55.2
            run: golangci-lint run
            working-directory: src/product-catalog

    docker: #This is a docker job. 
        runs-on: ubuntu-latest

        needs: build #This is necessary because it depends on the build process. 

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Install Docker
          uses: docker/setup-buildx-action@v1
        
        - name: Login to Docker
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Docker Push
          uses: docker/build-push-action@v6
          with:
            context: src/product-catalog
            file: src/product-catalog/Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:v1

    
    updatek8s:
        runs-on: ubuntu-latest

        needs: docker

        steps:
        - name: checkout code
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: Update tag in kubernetes deployment manifest
          run: | 
               sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml
        
        - name: Commit and push changes
          run: |
            git config --global user.email "akrofiannor1@gmail.com"
            git config --global user.name "akrofiannor"
            git add kubernetes/productcatalog/deploy.yaml
            git commit -m "[CI]: Update product catalog image tag"
            git push origin HEAD:main -f

        
        
          


        